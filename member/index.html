<!doctype html>
<html lang="th" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>สมาชิก | MarTech Discovery Platform</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/site.css"><script>document.documentElement.dataset.theme=localStorage.getItem('mdp-theme')||'dark'</script></head><body class="site"><header class="top"><a class="brand" href="/th/"><span class="brandmark"><img src="/assets/platform-discovery-mark.png" alt=""></span><span>MARTECH<br><b>DISCOVERY</b></span></a><nav><a href="/th/categories/">หมวดหมู่</a><a href="/th/buyer-guide/">คู่มือเลือกซื้อ</a></nav><div class="actions"><a class="textbtn" href="/__OTHER__/member/">EN <i>↔</i></a><a class="admin-demo-link" data-admin-link hidden href="/admin/">หลังบ้าน</a><a class="button small" href="/th/tools/">สำรวจเครื่องมือ</a></div></header><main class="member-wrap"><div class="breadcrumbs"><a href="/th/">หน้าหลัก</a> / สมาชิก</div><div class="eyebrow"><i>/</i> บัญชีสมาชิก</div><section class="member-head"><div><h1>Shortlist ของคุณ</h1><p class="member-muted" id="member-email">กำลังตรวจสอบบัญชี…</p></div><div class="member-actions"><button class="quiet" id="logout" hidden>ออกจากระบบ</button></div></section><ul class="member-list" id="favorites"></ul><p class="member-role" id="member-role"></p></main><script src="/vendors-data.js"></script><script>
const lang=document.documentElement.lang==='en'?'en':'th',T=(th,en)=>lang==='en'?en:th;
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=window.MDP_VENDORS||[],logos=window.MDP_VENDOR_LOGO_ASSETS||{};
const $=s=>document.querySelector(s);
function logo(v,label){const file=v&&logos[v.name];return file?`<span class="vendor-logo-source"><img src="/assets/vendor-logos/${encodeURIComponent(file)}" alt="" loading="lazy"></span>`:`<span class="vendor-logo-initial" aria-hidden="true">${html([...String(label).trim()][0]||'M')}</span>`}
async function load(){
  const me=await fetch('/api/member/me',{credentials:'same-origin'});const data=await me.json().catch(()=>({}));
  if(!me.ok){$('#member-email').innerHTML=T('เข้าสู่ระบบเพื่อดู shortlist ของคุณ','Sign in to see your shortlist')+` · <a href="/${lang}/login/">${T('เข้าสู่ระบบ','Sign in')}</a>`;$('#favorites').innerHTML=`<li class="member-empty">${T('Shortlist จะแสดงที่นี่หลังจากเข้าสู่ระบบ','Your saved vendors appear here after you sign in')}</li>`;return}
  const u=data.user||{};
  $('#member-email').textContent=[u.name,u.email].filter(Boolean).join(' · ');
  $('#logout').hidden=false;
  const roles={member:'Member',admin:'Admin',super_admin:'Super Admin'};
  $('#member-role').innerHTML=`${T('สิทธิ์บัญชี','Account role')}: <b>${html(roles[u.role]||u.role)}</b>`;
  if(['admin','super_admin'].includes(u.role))$('[data-admin-link]').hidden=false;
  const r=await fetch('/api/member/favorites',{credentials:'same-origin'}),f=await r.json().catch(()=>({}));
  const items=(f.favorites||[]).map(x=>{const v=all.find(item=>item.slug===x.slug);const label=v?.name||x.slug;
    const date=new Date(x.createdAt).toLocaleDateString(lang==='th'?'th-TH':'en-GB',{day:'numeric',month:'short',year:'numeric'});
    return `<li class="member-item">${logo(v,label)}<div style="min-width:0"><a href="/${lang}/providers/${encodeURIComponent(x.slug)}/">${html(label)}</a><small>${html(v?.category||'')}</small></div><time>${T('บันทึก','Saved')} ${html(date)}</time><button data-remove="${html(x.slug)}">${T('นำออก','Remove')}</button></li>`});
  $('#favorites').innerHTML=items.join('')||`<li class="member-empty">${T('ยังไม่มีผู้ให้บริการที่บันทึกไว้ · ','No saved vendors yet · ')}<a href="/${lang}/tools/">${T('ค้นหา MarTech','Explore MarTech')}</a></li>`;
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;await fetch('/api/member/favorites',{method:'DELETE',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({slug:b.dataset.remove})});load()});
}
$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.href=`/${lang}/login/`};
load().catch(()=>{$('#member-email').textContent=T('ไม่สามารถตรวจสอบบัญชีได้ ลองใหม่อีกครั้ง','We could not check your account. Try again.')});
</script></body></html>
